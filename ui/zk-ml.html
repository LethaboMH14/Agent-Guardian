<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Prime — ZK-ML Dive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #e8eaf0;
      color: #1e293b;
      min-height: 100vh;
    }
    
    .neomorphic-raised {
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      border-radius: 12px;
      border: none;
    }
    
    .neomorphic-inset {
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      border-radius: 12px;
      border: none;
    }
    
    .skeleton {
      background: linear-gradient(90deg, #dcdee4 25%, #e8eaf0 50%, #dcdee4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }
    
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .skeleton-value {
      height: 32px;
      width: 60%;
    }
    
    .error-state {
      color: #dc2626;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .retry-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
    }
    
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 256px;
      height: 100vh;
      background: #e8eaf0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    
    .sidebar-header {

    }
    
    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    
    .sidebar-version {

      color: #64748b;
    }
    
    .new-proof-btn {

      border-radius: 12px;
      background: #6366f1;
      color: white;
      border: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;

    }
    
    .new-proof-btn:hover {

    }
    
    .nav-links {

      display: flex;

      gap: 8px;

    .nav-link {

    .nav-link:hover {

    }
    
    .nav-link.active {

      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);

    .sidebar-bottom {

    }
    
    .lock-btn {

    .lock-btn:hover {

    .support-link {

      font-size: 14px;
    }
    
    .main-content {
      margin-left: 256px;

    .branding-icon {

      background: #e8eaf0;

      border: none;
      width: 100%;

      cursor: pointer;

      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);

      margin-top: -8px;
    }
    
    .param-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    }
    
    .param-label {

      color: #64748b;
    }
    
    .param-value {
      font-size: 14px;

      color: #1e293b;
    }
    
    .skeleton {
      background: linear-gradient(90deg, #e8eaf0 25%, #f1f3f5 50%, #e8eaf0 75%);
      background-size: 200% 100%;
      animation: pulse 1.5s infinite;
      border-radius: 4px;
    }
    
    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .skeleton-value {
      height: 32px;
      width: 60%;
    }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module">
    const { supabase, timeAgo, truncate, toast, loadTopBar, setActiveNav } = window.AG;
    
    // Load performance metrics
    async function loadPerformance() {
      try {
        const { data, error } = await supabase
          .from('aggregation_batches')
          .select('latency_ms')
          .order('created_at', { ascending: false })
          .limit(7);
        
        if (!error && data && data.length > 0) {
          const avg = data.reduce((sum, d) => sum + (d.latency_ms || 0), 0) / data.length;
          document.getElementById('perf-value').textContent = `${Math.round(avg)}ms/proof`;
          
          // Sparkline
          const maxLatency = Math.max(...data.map(d => d.latency_ms || 0));
          const sparkline = document.getElementById('sparkline');
          sparkline.innerHTML = data.map(d => {
            const height = ((d.latency_ms || 0) / maxLatency) * 100;
            return `<div class="sparkline-bar" style="height: ${height}%"></div>`;
          }).join('');
        }
      } catch (err) {
        console.error('Performance error:', err);
        document.getElementById('perf-value').textContent = '--ms/proof';
      }
    }
    
    // Load success rate
    async function loadSuccessRate() {
      try {
        const { data, error } = await supabase
          .from('council_sessions')
          .select('approved');
        
        if (!error && data && data.length > 0) {
          const total = data.length;
          const approved = data.filter(d => d.approved).length;
          const rate = (approved / total) * 100;
          
          document.getElementById('success-rate').textContent = `${rate.toFixed(1)}%`;
          
          // Animate gauge
          const gaugeFill = document.getElementById('gauge-fill');
          const circumference = 201;
          const offset = circumference - (rate / 100) * circumference;
          setTimeout(() => {
            gaugeFill.style.strokeDashoffset = offset;
          }, 100);
        }
      } catch (err) {
        console.error('Success rate error:', err);
        document.getElementById('success-rate').textContent = '--%';
      }
    }
    
    // Load security events
    async function loadSecurityEvents() {
      try {
        const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        
        const { count, error } = await supabase
          .from('sentinel_alerts')
          .select('*', { count: 'exact', head: true })
          .gte('severity', 2)
          .gte('created_at', oneDayAgo);
        
        if (!error) {
          document.getElementById('security-events').textContent = count || 0;
        }
      } catch (err) {
        console.error('Security events error:', err);
        document.getElementById('security-events').textContent = '--';
      }
      
      // Last audit sync
      try {
        const { data, error } = await supabase
          .from('sentinel_heartbeats')
          .select('created_at')
          .order('created_at', { ascending: false })
          .limit(1)
          .single();
        
        if (!error && data) {
          document.getElementById('audit-sync').textContent = `Last audit: ${timeAgo(data.created_at)}`;
        }
      } catch (err) {
        console.error('Audit sync error:', err);
      }
    }
    
    // Load proof explorer
    async function loadProofExplorer() {
      try {
        // Simplified query - using aggregation_batches directly
        const { data, error } = await supabase
          .from('aggregation_batches')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(10);
        
        if (!error && data) {
          const tbody = document.getElementById('proof-table');
          tbody.innerHTML = data.map(row => `
            <tr>
              <td>#BP-${row.id?.toString().slice(-4) || '----'}</td>
              <td>${truncate(row.agents?.[0] || 'Unknown', 8)}</td>
              <td>--</td>
              <td>${truncate(row.batch_root || '', 10)}</td>
              <td>${truncate(row.batch_root || '', 10)}</td>
              <td>${timeAgo(row.created_at)}</td>
              <td>
                ${row.nullifier 
                  ? '<span class="verified-badge">✓ Verified</span>'
                  : '<span class="pending-badge">Pending</span>'}
              </td>
              <td><span class="action-icon">👁️</span></td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('Proof explorer error:', err);
        document.getElementById('proof-table').innerHTML = '<tr><td colspan="8">Error loading proofs</td></tr>';
      }
    }
    
    // Accordion toggle
    document.getElementById('accordion-toggle').addEventListener('click', () => {
      const content = document.getElementById('accordion-content');
      const icon = document.getElementById('accordion-icon');
      content.classList.toggle('open');
      icon.textContent = content.classList.contains('open') ? '▲' : '▼';
    });
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      setActiveNav();
      loadTopBar();
      loadPerformance();
      loadSuccessRate();
      loadSecurityEvents();
      loadProofExplorer();
    });
  </script>
</body>
</html>
