<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentGuardian — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #e8eaf0;
      color: #1e293b;
      min-height: 100vh;
    }
    
    .neomorphic-raised {
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      border-radius: 12px;
      border: none;
    }
    
    .neomorphic-inset {
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      border-radius: 12px;
      border: none;
    }
    
    .skeleton {
      background: linear-gradient(90deg, #dcdee4 25%, #e8eaf0 50%, #dcdee4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }
    
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .skeleton-value {
      height: 32px;
      width: 60%;
    }
    
    .error-state {
      color: #dc2626;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .retry-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
    }
    
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 256px;
      height: 100vh;
      background: #e8eaf0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    
    .sidebar-header {
      margin-bottom: 32px;
    }
    
    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    
    .sidebar-subtitle {
      font-size: 12px;
      color: #64748b;
    }
    
    .nav-links {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .nav-link {
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
 color: #64748b;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .nav-link:hover {
      color: #6366f1;
    }
    
    .nav-link.active {
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      color: #6366f1;
    }
    
    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .upgrade-btn {
      padding: 12px 16px;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      border: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 6px 6px 12px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
    }
    
    .upgrade-btn:hover {
      background: #4f46e5;
    }
    
    .lock-btn {
      padding: 12px 16px;
      border-radius: 12px;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      border: none;
      color: #dc2626;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .lock-btn:hover {
      box-shadow: 4px 4px 8px rgba(0,0,0,0.06), -4px -4px 8px rgba(255,255,255,0.5);
    }
    
    .support-link {
      text-align: center;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }
    
    .main-content {
      margin-left: 256px;
      padding: 24px;
    }
    
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
    }
    
    .branding {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .branding-icon {
      width: 40px;
      height: 40px;
      background: #6366f1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }
    
    .branding-text {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
    }
    
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #64748b;
      font-size: 18px;
      transition: all 0.2s;
    }
    
    .icon-btn:hover {
      color: #6366f1;
    }
    
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }
    
    .page-header {
      margin-bottom: 24px;
    }
    
    .page-title {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    
    .page-subtitle {
      font-size: 14px;
      color: #64748b;
    }
    
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .tab {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      font-family: inherit;
      font-weight: 500;
      font-size: 14px;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .tab:hover {
      color: #6366f1;
    }
    
    .tab.active {
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      color: #6366f1;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .layer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    
    .card {
      padding: 24px;
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    
    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .card-title-section {
      flex: 1;
      margin-left: 12px;
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    
    .status-dot.active { background: #10b981; }
    .status-dot.learning { background: #f59e0b; }
    .status-dot.disabled { background: #cbd5e1; }
    
    .status-label {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
    }
    
    .card-description {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    
    .card-actions {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-raised {
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      color: #1e293b;
    }
    
    .btn-raised:hover {
      box-shadow: 4px 4px 8px rgba(0,0,0,0.06), -4px -4px 8px rgba(255,255,255,0.5);
    }
    
    .btn-primary {
      background: #6366f1;
      color: white;
      box-shadow: 6px 6px 12px rgba(99, 102, 241, 0.3);
    }
    
    .btn-primary:hover {
      background: #4f46e5;
    }
    
    /* Neomorphic Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 28px;
    }
    
    .toggle-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .toggle-thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 10px;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      transition: all 0.3s;
    }
    
    .toggle-switch.active .toggle-thumb {
      left: 24px;
      background: #6366f1;
      box-shadow: 4px 4px 8px rgba(99, 102, 241, 0.3);
    }
    
    .toggle-switch.active .toggle-track {
      background: #6366f1;
    }
    
    .full-width-card {
      grid-column: 1 / -1;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      margin-bottom: 8px;
      display: block;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #e8eaf0;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);
      font-family: inherit;
      font-size: 14px;
      color: #1e293b;
    }
    
    .form-input:focus {
      outline: none;
    }
    
    .form-select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #e8eaf0;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);
      font-family: inherit;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
    }
    
    .key-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    
    .key-row:last-child {
      border-bottom: none;
    }
    
    .key-name {
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
    }
    
    .key-value {
      font-family: monospace;
      font-size: 14px;
      color: #64748b;
      margin-right: 16px;
    }
    
    .warning-text {
      font-size: 12px;
      color: #f59e0b;
      margin-bottom: 16px;
    }
    
    /* Modal */
    dialog {
      border: none;
      border-radius: 16px;
      background: #e8eaf0;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      padding: 24px;
      max-width: 500px;
    }
    
    dialog::backdrop {
      background: rgba(0,0,0,0.5);
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 16px;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #64748b;
      float: right;
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    
    .skeleton {
      background: linear-gradient(90deg, #e8eaf0 25%, #f1f3f5 50%, #e8eaf0 75%);
      background-size: 200% 100%;
      animation: pulse 1.5s infinite;
      border-radius: 4px;
    }
    
    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .skeleton-card {
      height: 180px;
    }
  </style>
</head>
<body>
  <script src="js/env.js"></script>
  <script src="js/client.js"></script>
  <script type="module">
    import { initNav } from './js/nav.js';
    import { initTopBar } from './js/topbar.js';
    initNav('settings');
    initTopBar();
  </script>

  <!-- Main content -->
  <main class="main-content">
    <!-- Page header -->
    <div class="page-header">
      <h1 class="page-title">SETTINGS</h1>
      <p class="page-subtitle">Configure your guardian network parameters and security layers.</p>
    </div>
    
    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab" data-tab="general">General</button>
      <button class="tab active" data-tab="security-layers">Security Layers</button>
      <button class="tab" data-tab="notifications">Notifications</button>
      <button class="tab" data-tab="api-keys">API & Keys</button>
      <button class="tab" data-tab="network">Network</button>
      <button class="tab" data-tab="billing">Billing</button>
    </div>
    
    <!-- Security Layers tab -->
    <div class="tab-content active" id="security-layers">
      <div class="layer-grid" id="layer-cards">
        <div class="card neomorphic-raised skeleton skeleton-card"></div>
        <div class="card neomorphic-raised skeleton skeleton-card"></div>
        <div class="card neomorphic-raised skeleton skeleton-card"></div>
      </div>
      
      <div class="card neomorphic-raised full-width-card" id="firewall-card">
        <div class="skeleton" style="height: 120px;"></div>
      </div>
    </div>
    
    <!-- General tab -->
    <div class="tab-content" id="general">
      <div class="card neomorphic-raised" style="max-width: 600px;">
        <div class="form-group">
          <label class="form-label">Organization Name</label>
          <input type="text" class="form-input" placeholder="Enter organization name">
        </div>
        
        <div class="form-group">
          <label class="form-label">Connected Wallet</label>
          <div class="form-input" id="wallet-address">Not connected</div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Chain Selector</label>
          <select class="form-select">
            <option>Arc Testnet</option>
            <option>Arc Mainnet</option>
          </select>
        </div>
        
        <button class="btn btn-primary">Save Changes</button>
      </div>
    </div>
    
    <!-- API & Keys tab -->
    <div class="tab-content" id="api-keys">
      <div class="card neomorphic-raised">
        <p class="warning-text">⚠️ Never expose full API keys in the frontend</p>
        <div id="keys-list">
          <div class="skeleton" style="height: 60px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 60px;"></div>
        </div>
      </div>
    </div>
    
    <!-- Notifications tab -->
    <div class="tab-content" id="notifications">
      <div class="card neomorphic-raised">
        <p style="color: #64748b;">Notification settings coming soon.</p>
      </div>
    </div>
    
    <!-- Network tab -->
    <div class="tab-content" id="network">
      <div class="card neomorphic-raised">
        <p style="color: #64748b;">Network settings coming soon.</p>
      </div>
    </div>
    
    <!-- Billing tab -->
    <div class="tab-content" id="billing">
      <div class="card neomorphic-raised">
        <p style="color: #64748b;">Billing settings coming soon.</p>
      </div>
    </div>
  </main>
  
  <!-- Configure Modal -->
  <dialog id="configure-modal">
    <button class="modal-close" id="modal-close">×</button>
    <h3 class="modal-title" id="modal-title">Configure Layer</h3>
    <div id="modal-content"></div>
    <div class="modal-actions">
      <button class="btn btn-raised" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save</button>
    </div>
  </dialog>
  
  <script src="js/env.js"></script>
  <script type="module">
    const { supabase, getSigner, truncate, toast, loadTopBar, setActiveNav, safeContractRead } = window.AG;
    
    let layerConfigs = {};
    let currentLayerId = null;
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        tab.classList.add('active');
        const tabId = tab.dataset.tab;
        document.getElementById(tabId).classList.add('active');
      });
    });
    
    // Load layer configs
    async function loadLayerConfigs() {
      try {
        const { data, error } = await supabase
          .from('layer_config')
          .select('*');
        
        if (!error && data) {
          layerConfigs = {};
          data.forEach(row => {
            layerConfigs[row.layer_id] = row;
          });
          
          renderLayerCards();
        }
      } catch (err) {
        console.error('Layer config error:', err);
      }
    }
    
    // Render layer cards
    function renderLayerCards() {
      const grid = document.getElementById('layer-cards');
      const firewallCard = document.getElementById('firewall-card');
      
      const layerInfo = {
        zkml: { icon: '⚡', title: 'ZK-ML Verifier', description: 'Zero-knowledge proof verification for model inference outputs.' },
        council: { icon: '👥', title: 'Council Consensus', description: 'Multi-agent voting protocol for transaction approval.' },
        vaccine: { icon: '💉', title: 'Prompt Vaccine', description: 'Self-immunizing threat defense against adversarial prompts.' },
        firewall: { icon: '🔥', title: 'Semantic Policy Firewall', description: 'Content filtering based on semantic policy rules.' }
      };
      
      const cardHtml = (layerId, info, config) => {
        const isEnabled = config?.enabled || false;
        const status = config?.status || 'Disabled';
        const statusClass = status.toLowerCase() === 'active' ? 'active' : status.toLowerCase() === 'learning' ? 'learning' : 'disabled';
        
        return `
          <div class="card neomorphic-raised">
            <div class="card-header">
              <div class="card-icon">${info.icon}</div>
              <div class="card-title-section">
                <div class="card-title">${info.title}</div>
                <div>
                  <span class="status-dot ${statusClass}"></span>
                  <span class="status-label">${status}</span>
                </div>
              </div>
              <div class="toggle-switch ${isEnabled ? 'active' : ''}" data-layer="${layerId}">
                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>
              </div>
            </div>
            <div class="card-description">${info.description}</div>
            <div class="card-actions">
              <button class="btn btn-raised" onclick="openConfigure('${layerId}')">Configure</button>
              <button class="btn btn-raised" onclick="viewLogs('${layerId}')">Logs</button>
            </div>
          </div>
        `;
      };
      
      grid.innerHTML = cardHtml('zkml', layerInfo.zkml, layerConfigs.zkml) + 
                       cardHtml('council', layerInfo.council, layerConfigs.council) +
                       cardHtml('vaccine', layerInfo.vaccine, layerConfigs.vaccine);
      
      firewallCard.innerHTML = cardHtml('firewall', layerInfo.firewall, layerConfigs.firewall);
      
      // Add toggle listeners
      document.querySelectorAll('.toggle-switch').forEach(toggle => {
        toggle.addEventListener('click', () => {
          const layerId = toggle.dataset.layer;
          const isEnabled = toggle.classList.contains('active');
          toggleLayer(layerId, !isEnabled, toggle);
        });
      });
    }
    
    // Toggle layer
    async function toggleLayer(layerId, enabled, toggleEl) {
      const newStatus = enabled ? 'Active' : 'Disabled';
      
      // Optimistic UI update
      toggleEl.classList.toggle('active', enabled);
      const statusDot = toggleEl.closest('.card-header').querySelector('.status-dot');
      const statusLabel = toggleEl.closest('.card-header').querySelector('.status-label');
      statusDot.className = `status-dot ${enabled ? 'active' : 'disabled'}`;
      statusLabel.textContent = newStatus;
      
      try {
        const { error } = await supabase
          .from('layer_config')
          .update({ enabled, status: newStatus, updated_at: new Date().toISOString() })
          .eq('layer_id', layerId);
        
        if (error) {
          // Revert on error
          toggleEl.classList.toggle('active', !enabled);
          statusDot.className = `status-dot ${!enabled ? 'active' : 'disabled'}`;
          statusLabel.textContent = !enabled ? 'Active' : 'Disabled';
          console.error('Toggle error:', error);
        }
      } catch (err) {
        console.error('Toggle error:', err);
      }
    }
    
    // Open configure modal
    window.openConfigure = function(layerId) {
      currentLayerId = layerId;
      const modal = document.getElementById('configure-modal');
      const title = document.getElementById('modal-title');
      const content = document.getElementById('modal-content');
      
      const config = layerConfigs[layerId] || {};
      const configJson = typeof config.config_json === 'string' 
        ? JSON.parse(config.config_json) 
        : config.config_json || {};
      
      let html = '';
      
      if (layerId === 'zkml') {
        title.textContent = 'Configure ZK-ML Verifier';
        html = `
          <div class="form-group">
            <label class="form-label">Model Commitment Hash</label>
            <input type="text" class="form-input" value="${configJson.model_commitment || ''}" readonly>
          </div>
          <div class="form-group">
            <label class="form-label">Threshold</label>
            <input type="range" class="form-input" min="0" max="100" value="${configJson.threshold || 50}">
          </div>
        `;
      } else if (layerId === 'council') {
        title.textContent = 'Configure Council Consensus';
        html = `
          <div class="form-group">
            <label class="form-label">Quorum Required</label>
            <input type="number" class="form-input" value="${configJson.quorum_required || 2}" min="1" max="3">
          </div>
          <div class="form-group">
            <label class="form-label">Timeout (seconds)</label>
            <input type="number" class="form-input" value="${configJson.timeout_seconds || 300}" min="60">
          </div>
        `;
      } else if (layerId === 'vaccine') {
        title.textContent = 'Configure Prompt Vaccine';
        html = `
          <div class="form-group">
            <label class="form-label">SOFT Tier Cutoff</label>
            <input type="number" class="form-input" value="${configJson.soft_cutoff || 50}" min="0" max="100">
          </div>
          <div class="form-group">
            <label class="form-label">HARD Tier Cutoff</label>
            <input type="number" class="form-input" value="${configJson.hard_cutoff || 75}" min="0" max="100">
          </div>
          <div class="form-group">
            <label class="form-label">PERMANENT Tier Cutoff</label>
            <input type="number" class="form-input" value="${configJson.perm_cutoff || 90}" min="0" max="100">
          </div>
        `;
      } else if (layerId === 'firewall') {
        title.textContent = 'Configure Semantic Policy Firewall';
        html = `
          <div class="form-group">
            <label class="form-label">Policy Regex (Blocked Patterns)</label>
            <textarea class="form-input" rows="4" placeholder="Enter regex patterns, one per line">${configJson.policy_regex || ''}</textarea>
          </div>
        `;
      }
      
      content.innerHTML = html;
      modal.showModal();
    };
    
    // View logs
    window.viewLogs = function(layerId) {
      window.location.href = `system-logs.html?filter=${layerId}`;
    };
    
    // Modal save
    document.getElementById('modal-save').addEventListener('click', async () => {
      const content = document.getElementById('modal-content');
      const inputs = content.querySelectorAll('input, textarea');
      const configJson = {};
      
      inputs.forEach(input => {
        const label = content.querySelector(`label[for="${input.id}"]`) || input.previousElementSibling;
        if (label) {
          const key = label.textContent.toLowerCase().replace(/[^a-z]/g, '');
          configJson[key] = input.value;
        }
      });
      
      try {
        const { error } = await supabase
          .from('layer_config')
          .update({ config_json })
          .eq('layer_id', currentLayerId);
        
        if (!error) {
          document.getElementById('configure-modal').close();
          // Reload configs
          await loadLayerConfigs();
        }
      } catch (err) {
        console.error('Save error:', err);
      }
    });
    
    // Modal cancel/close
    document.getElementById('modal-cancel').addEventListener('click', () => {
      document.getElementById('configure-modal').close();
    });
    
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('configure-modal').close();
    });
    
    // Load wallet address
    async function loadWalletAddress() {
      try {
        const signer = await getSigner();
        const address = await signer.getAddress();
        document.getElementById('wallet-address').textContent = truncate(address, 10);
      } catch (err) {
        // Wallet not connected
      }
    }
    
    // Load API keys
    async function loadApiKeys() {
      try {
        // Mock API keys until backend route exists
        const data = [
          { name: 'SUPABASE_ANON_KEY', maskedValue: '••••••••••••' + (window.ENV_SUPABASE_ANON_KEY || '').slice(-4) },
          { name: 'ARC_RPC_URL', maskedValue: '••••••••••••.xyz' },
          { name: 'AGENT_REGISTRY_KEY', maskedValue: '••••••••0000' }
        ];
        
        if (data && data.length > 0) {
          const container = document.getElementById('keys-list');
          container.innerHTML = data.map(key => `
            <div class="key-row">
              <div>
                <div class="key-name">${key.name}</div>
              </div>
              <div style="display: flex; align-items: center;">
                <span class="key-value">${key.maskedValue}</span>
                <button class="btn btn-raised" onclick="regenerateKey('${key.name}')">Regenerate</button>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('API keys error:', err);
        document.getElementById('keys-list').innerHTML = '<p style="color: #64748b;">Unable to load keys</p>';
      }
    }
    
    // Regenerate key
    window.regenerateKey = async function(keyName) {
      try {
        const response = await fetch(`/api/rotate-key?name=${keyName}`, { method: 'POST' });
        const data = await response.json();
        
        if (data) {
          await loadApiKeys();
        }
      } catch (err) {
        console.error('Regenerate error:', err);
      }
    };
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      setActiveNav();
      loadTopBar();
      loadLayerConfigs();
      loadWalletAddress();
      loadApiKeys();
    });
  </script>
</body>
</html>
