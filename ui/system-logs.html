<body>
  <script src="js/env.js"></script>
  <script src="js/client.js"></script>
  <script type="module">
    import { initNav } from './js/nav.js';
    import { initTopBar } from './js/topbar.js';
    initNav('system-logs');
    initTopBar();
  </script>

  <!-- Main content -->
  <main class="main-content">
    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">System Logs</h1>
        <p class="page-subtitle">Real-time audit trail and system events across all agent networks.</p>
      </div>
      <div class="header-buttons">
        <button class="btn btn-raised" id="filter-btn">
          <span>🔍</span> Filter
        </button>

          <span>📥</span> Export
        </button>
      </div>
    </div>
    
    <!-- Stat cards -->
    <div class="stat-cards">
      <div class="stat-card neomorphic-raised">
        <div class="stat-label">Events/Sec</div>
        <div class="stat-value">
          <span id="events-per-sec">0</span>
          <span class="live-badge"><div class="live-dot"></div>LIVE</span>
        </div>
      </div>
      
      <div class="stat-card neomorphic-raised">
        <div class="stat-label">Critical Alerts</div>
        <div class="stat-value" id="critical-alerts">
          <div class="skeleton skeleton-value"></div>
        </div>
        <div class="trend-badge">+12% vs last hour</div>
      </div>
      
      <div class="stat-card neomorphic-raised">
        <div class="stat-label">Quick Filters</div>
        <div class="filter-chips">
          <button class="chip active" data-filter="all">All Sources</button>
          <button class="chip" data-filter="api">API Gateway</button>
          <button class="chip" data-filter="auth">Auth Service</button>
          <button class="chip" data-filter="agent">Agents</button>
        </div>
      </div>
    </div>
    
    <!-- Activity stream -->
    <div class="activity-stream neomorphic-raised">
      <h3 class="section-title">Recent Activity Stream</h3>
      <div id="log-entries">
        <div class="skeleton" style="height: 80px; margin-bottom: 12px;"></div>
        <div class="skeleton" style="height: 80px; margin-bottom: 12px;"></div>

  </main>
  
  <!-- Details modal -->
  <dialog id="details-modal">
    <div class="modal-header">
      <h3 class="modal-title">Event Details</h3>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-content">
      <pre><code id="modal-json"></code></pre>
    </div>
  </dialog>
  
  <script src="js/env.js"></script>
  <script type="module">
    const { supabase, timeAgo, truncate, toast, loadTopBar, setActiveNav } = window.AG;
    
    let activityData = [];
    let currentFilter = 'all';
    let eventCount = 0;
    let eventHistory = [];
    
    // Load critical alerts
    async function loadCriticalAlerts() {
      try {
        const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString();
        const { count, error } = await supabase
          .from('sentinel_alerts')
          .select('*', { count: 'exact', head: true })
          .gte('severity', 2)
          .gte('created_at', oneHourAgo);
        
        if (!error) {
          document.getElementById('critical-alerts').textContent = count || 0;
        }
      } catch (err) {
        console.error('Critical alerts error:', err);
        document.getElementById('critical-alerts').textContent = '--';
      }
    }
    
    // Load activity stream
    async function loadActivityStream() {
      try {
        const [alerts, sessions, freezes] = await Promise.all([
          supabase.from('sentinel_alerts').select('*').order('created_at', { ascending: false }).limit(20),
          supabase.from('council_sessions').select('*').order('created_at', { ascending: false }).limit(20),
          supabase.from('cross_chain_freezes').select('*').order('created_at', { ascending: false }).limit(10)
        ]);
        
        const mapped = [];
        
        // Map alerts
        alerts.data?.forEach(row => {
          const severityMap = { 3: 'critical', 2: 'warn', 1: 'info' };
          mapped.push({
            id: row.id,
            timestamp: row.created_at,
            severity: severityMap[row.severity] || 'info',
            title: row.alert_type || 'Alert',
            description: row.message || 'No description',
            source: 'sentinel',
            data: row
          });
        });
        
        // Map sessions
        sessions.data?.forEach(row => {
          mapped.push({
            id: row.id,
            timestamp: row.created_at,
            severity: row.approved ? 'info' : 'warn',
            title: row.approved ? 'Agent Deployment Successful' : 'Agent Action Blocked',
            description: `Agent: ${truncate(row.agent, 8)} | Recipient: ${truncate(row.recipient, 8)} | Amount: ${row.amount}`,
            source: 'council',
            data: row
          });
        });
        
        // Map freezes
        freezes.data?.forEach(row => {
          mapped.push({
            id: row.id,
            timestamp: row.created_at,
            severity: row.status === 'PROPAGATED' ? 'critical' : 'warn',
            title: 'Cross-Chain Freeze Propagated',
            description: `Agent: ${truncate(row.agent_address, 8)} | Source: ${row.source_chain} | Destinations: ${row.destination_chains?.join(', ')}`,
            source: 'crosschain',
            data: row
          });
        });
        
        // Sort by timestamp
        mapped.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        activityData = mapped.slice(0, 50);
        renderActivityStream();
      } catch (err) {
        console.error('Activity stream error:', err);
        document.getElementById('log-entries').innerHTML = '<p style="color: #64748b;">Error loading logs</p>';
      }
    }
    
    // Render activity stream
    function renderActivityStream() {
      const container = document.getElementById('log-entries');
      const filtered = currentFilter === 'all' 
        ? activityData 
        : activityData.filter(item => {
            if (currentFilter === 'api') return item.source === 'council';
            if (currentFilter === 'auth') return item.source === 'crosschain';
            if (currentFilter === 'agent') return item.source === 'sentinel';
            return true;
          });
      
      container.innerHTML = filtered.map(item => `
        <div class="log-entry ${item.severity} fade-in" data-id="${item.id}">
          <div class="log-timestamp">${timeAgo(item.timestamp)}</div>
          <div class="log-content">
            <div class="log-header">
              <span class="severity-badge ${item.severity}">${item.severity}</span>
              <span class="log-title">${item.title}</span>
            </div>
            <div class="log-description">${item.description}</div>
            <a class="view-details" data-id="${item.id}">View Details</a>
          </div>
        </div>
      `).join('');
      
      // Add click handlers for View Details
      container.querySelectorAll('.view-details').forEach(link => {
        link.addEventListener('click', (e) => {
          const id = e.target.dataset.id;
          const item = activityData.find(d => d.id == id);
          if (item) showDetails(item);
        });
      });
    }
    
    // Show details modal
    function showDetails(item) {
      const modal = document.getElementById('details-modal');
      const jsonCode = document.getElementById('modal-json');
      jsonCode.textContent = JSON.stringify(item.data, null, 2);
      hljs.highlightElement(jsonCode);
      modal.showModal();
    }
    
    // Realtime subscription
    function setupRealtime() {
      const channel = supabase
        .channel('activity-stream')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'council_sessions' }, (payload) => {
          handleRealtimeEvent('council', payload.new);
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cross_chain_freezes' }, (payload) => {
          handleRealtimeEvent('crosschain', payload.new);
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sentinel_alerts' }, (payload) => {
          handleRealtimeEvent('sentinel', payload.new);
        })
        .subscribe();
      
      return channel;
    }
    
    function handleRealtimeEvent(source, data) {
      eventCount++;
      eventHistory.push(Date.now());
      
      // Clean old events (>5 seconds)
      eventHistory = eventHistory.filter(t => Date.now() - t < 5000);
      
      let mapped;
      if (source === 'council') {
        mapped = {
          id: data.id,
          timestamp: data.created_at,
          severity: data.approved ? 'info' : 'warn',
          title: data.approved ? 'Agent Deployment Successful' : 'Agent Action Blocked',
          description: `Agent: ${truncate(data.agent, 8)} | Recipient: ${truncate(data.recipient, 8)} | Amount: ${data.amount}`,
          source: 'council',
          data: data
        };
      } else if (source === 'crosschain') {
        mapped = {
          id: data.id,
          timestamp: data.created_at,
          severity: data.status === 'PROPAGATED' ? 'critical' : 'warn',
          title: 'Cross-Chain Freeze Propagated',
          description: `Agent: ${truncate(data.agent_address, 8)} | Source: ${data.source_chain}`,
          source: 'crosschain',
          data: data
        };
      } else {
        const severityMap = { 3: 'critical', 2: 'warn', 1: 'info' };
        mapped = {
          id: data.id,
          timestamp: data.created_at,
          severity: severityMap[data.severity] || 'info',
          title: data.alert_type || 'Alert',
          description: data.message || 'No description',
          source: 'sentinel',
          data: data
        };
      }
      
      activityData.unshift(mapped);
      activityData = activityData.slice(0, 50);
      renderActivityStream();
    }
    
    // Update events/sec counter
    function updateEventsPerSec() {
      const now = Date.now();
      eventHistory = eventHistory.filter(t => now - t < 5000);
      document.getElementById('events-per-sec').textContent = eventHistory.length;
    }
    
    // Filter chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        renderActivityStream();
      });
    });
    
    // Export to CSV
    document.getElementById('export-btn').addEventListener('click', async () => {
      try {
        const { data, error } = await supabase
          .from('sentinel_alerts')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1000);
        
        if (error) throw error;
        
        const headers = Object.keys(data[0] || {}).join(',');
        const rows = data.map(row => Object.values(row).join(','));
        const csv = [headers, ...rows].join('\n');
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `system-logs-${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Export error:', err);
        alert('Export failed');
      }
    });
    
    // Modal close
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('details-modal').close();
    });
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      setActiveNav();
      loadTopBar();
      loadCriticalAlerts();
      loadActivityStream();
      setupRealtime();
      setInterval(updateEventsPerSec, 1000);
    });
  </script>
</body>
</html>
